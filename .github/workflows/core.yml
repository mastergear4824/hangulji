name: core
on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            core-swift/.build
            macos/.build
          key: spm-${{ runner.os }}-${{ hashFiles('core-swift/Package.resolved') }}
      - name: Core tests (fixtures 포함)
        run: swift test --package-path core-swift
      - name: macOS shell release build
        run: swift build -c release --package-path macos
      - name: 생성물 최신성 (테이블·픽스처)
        # diff 범위를 생성 산출물로 한정 — 러너의 SwiftPM이 Package.resolved를
        # 재작성해도 오탐하지 않도록 (검사 의도는 '생성물이 소스와 일치하는가'뿐)
        run: |
          swift spec/generators/gen-swift.swift
          swift spec/generators/gen-mozc-table.swift
          swift run --package-path core-swift fixture-export
          git diff --exit-code -- spec windows core-swift/Sources/HanguljiCore/KanaTable.generated.swift

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: ios/build
          key: ios-${{ runner.os }}-${{ hashFiles('core-swift/Package.resolved') }}
      # 러너 이미지마다 시뮬레이터 기기명이 달라 하드코딩 대신 동적으로 선택한다
      - name: Select simulator
        id: sim
        shell: bash
        run: |
          xcrun simctl list devices available | grep iPhone || true
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [A-Za-z0-9 ]+' | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then echo "사용 가능한 iPhone 시뮬레이터 없음"; exit 1; fi
          echo "device=${DEVICE}" >> "$GITHUB_OUTPUT"
          echo "selected: ${DEVICE}"
      - name: Build (simulator)
        shell: bash
        run: |
          cd ios && xcodegen generate
          xcodebuild -project Hangulji.xcodeproj -scheme HanguljiApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Model tests
        shell: bash
        run: |
          cd ios && xcodebuild -project Hangulji.xcodeproj -scheme HanguljiApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test | tail -5
