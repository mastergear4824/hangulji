[package]
name = "hangulji-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "hangulji_bridge"
path = "src/lib.rs"

[[bin]]
name = "hangulji-bridge"
path = "src/main.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
